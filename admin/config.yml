backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "selected_works"
    label: "Selected Works (Portfolio Gallery)"
    folder: "content/works" # 獨立一個 folder 處理 Gallery 項目
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Project Title (Folder Name)", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "thumbnail", widget: "image"}
      - label: "Gallery Photos"
        name: "photos"
        widget: "list"
        field: {label: "Photo", name: "photo", widget: "image"}
      - label: "Main Project Type"
        name: "project_type"
        widget: "select"
        options: ["Wedding", "Pre-Wedding", "Portrait", "Commercial"]
      - label: "Category / Region (Primary Menu)"
        name: "category"
        widget: "select"
        options: 
          - "UK"
          - "Destinations"
          - "Hong Kong"
          - "Studio"
          - "Family"
          - "Maternity"
          - "Engagement & Portrait"
          - "Graduation"
          - "Fashion & Portrait"
          - "Corporate"
          - "Advertising"
          - "Jewellery"
          - "Food"
          - "Interior"
          - "Events"
        hint: "選擇你的大分類（如 Pre-Wedding 的 'UK'，或 Portrait 的 'Family'）"
      - label: "Location Tag (City / Venue)"
        name: "location"
        widget: "string"
        required: false
        hint: "例如 'London', 'Paris', 'Studio'。對於 Wedding，這會變成第二層 Menu；對於 Portrait/Commercial，這只會顯示為相片下方的 Caption。"

  - name: "journal"
    label: "Journal (日誌文章)"
    folder: "content/journal"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "thumbnail", widget: "image"}
      - {label: "Snippet (Short Intro)", name: "snippet", widget: "text", required: false}
      - {label: "Location", name: "location", widget: "string", required: false}
      - label: "Project Type"
        name: "project_type"
        widget: "select"
        options: ["Pre-Wedding", "Wedding Day", "Portrait", "Commercial", "Editorial"]
        required: false
      - {label: "Member of HKPPA", name: "tag_hkppa", widget: "boolean", default: false, required: false}
      - {label: "Rosewood Approved", name: "tag_rosewood", widget: "boolean", default: false, required: false}
      - {label: "Body Text", name: "body", widget: "markdown"}

  - name: "promotion_settings"
    label: "Promotion Settings"
    files:
      - label: "Promotion Details"
        name: "promotion"
        file: "data/promotion.json"
        format: "json"
        fields:
          - {label: "Show Promotion?", name: "is_active", widget: "boolean", default: false}
          - {label: "Poster Image", name: "poster", widget: "image"}
          - {label: "Expiry Date", name: "expiry_date", widget: "datetime", format: "YYYY-MM-DD"}
          - {label: "Email Subject", name: "subject", widget: "string", default: "Inquiry about Promotion"}