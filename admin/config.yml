backend:
  name: git-gateway
  branch: main 

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "journal"
    label: "Journal (Stories)"
    folder: "content/journal"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "thumbnail", widget: "image"}
      - {label: "Snippet (Short Intro)", name: "snippet", widget: "text", required: false}
      - {label: "Body Text", name: "body", widget: "markdown"}