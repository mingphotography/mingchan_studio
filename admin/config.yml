backend:
  name: git-gateway
  branch: main

# 開啟草稿箱 (Editorial Workflow) 功能
publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # 1. 首頁 Hero 大圖設定
  # ==========================================
  - name: "hero_settings"
    label: "🌟 首頁大圖 (Hero Banner) 設定"
    files:
      - file: "content/hero.json"
        label: "首頁 6 張輪播大圖管理"
        name: "hero_slides"
        fields:
          - label: "👉 點擊下方按鈕以新增或修改首頁大圖 (建議設定 6 張)"
            name: "slides"
            widget: "list"
            hint: "💡 提示：按「Add」新增相片；可以隨時用滑鼠上下拖曳來調整輪播順序。"
            fields:
              - { label: "🖼️ 選擇相片檔", name: "image", widget: "image", required: true, hint: "建議上傳高清橫向大圖" }
              - { label: "📍 相片主題 / 地點文字 (可選)", name: "title", widget: "string", required: false, hint: "例如：SEVEN SISTERS, UK" }
              - { 
                  label: "🎯 手機版主體焦點位置 (防裁切)", 
                  name: "focus", 
                  widget: "select", 
                  options: [
                    { label: "置中 (預設 - 主體在中間)", value: "center center" },
                    { label: "靠左 (主角在左邊時選這個)", value: "left center" },
                    { label: "靠右 (主角在右邊時選這個)", value: "right center" }
                  ],
                  default: "center center",
                  hint: "⚠️ 手機直向瀏覽時橫相左右會被裁切。如果主角偏左或偏右，請在這裡更改對齊方向！"
                }

  # ==========================================
  # 2. 作品集 (Selected Works) 管理
  # ==========================================
  - name: "selected_works"
    label: "📁 作品集 (Selected Works)"
    folder: "content/works"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Project Title (Folder Name)", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "thumbnail", widget: "image" }
      - label: "Gallery Photos"
        name: "photos"
        widget: "list"
        field: { label: "Photo", name: "photo", widget: "image" }
      - label: "Main Project Type"
        name: "project_type"
        widget: "select"
        options: ["Wedding", "Pre-Wedding", "Portrait", "Commercial"]
      - label: "Category / Region (Primary Menu)"
        name: "category"
        widget: "select"
        options: 
          - "UK"
          - "Destinations"
          - "Hong Kong"
          - "Studio"
          - "Family"
          - "Maternity"
          - "Engagement & Portrait"
          - "Graduation"
          - "Fashion & Portrait"
          - "Corporate"
          - "Advertising"
          - "Jewellery"
          - "Food"
          - "Interior"
          - "Events"
        hint: "選擇你的大分類（如 Pre-Wedding 的 'UK'，或 Portrait 的 'Family'）"
      - label: "Location Tag (City / Venue)"
        name: "location"
        widget: "string"
        required: false
        hint: "例如 'London', 'Paris', 'Studio'。對於 Wedding，這會變成第二層 Menu；對於 Portrait/Commercial，這只會顯示為相片下方的 Caption。"

  # ==========================================
  # 3. 日誌文章 (Journal) 管理
  # ==========================================
  - name: "journal"
    label: "📖 日誌文章 (Journal)"
    folder: "content/journal"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "thumbnail", widget: "image" }
      - { label: "Snippet (Short Intro)", name: "snippet", widget: "text", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - label: "Project Type"
        name: "project_type"
        widget: "select"
        options: ["Pre-Wedding", "Wedding Day", "Portrait", "Commercial", "Editorial"]
        required: false
      - { label: "Member of HKPPA", name: "tag_hkppa", widget: "boolean", default: false, required: false }
      - { label: "Rosewood Approved", name: "tag_rosewood", widget: "boolean", default: false, required: false }
      - { label: "Body Text", name: "body", widget: "markdown" }

  # ==========================================
  # 4. 限時優惠設定 (Promotion Settings)
  # ==========================================
  - name: "promotion_settings"
    label: "🎁 限時優惠設定 (Promotion)"
    files:
      - label: "優惠彈窗與宣傳管理"
        name: "promotion"
        file: "data/promotion.json"
        format: "json"
        fields:
          - { label: "🔔 是否啟用優惠彈窗？ (Show Promotion)", name: "is_active", widget: "boolean", default: false, hint: "開啟後（打勾），訪客瀏覽主頁時會自動彈出推廣海報；關閉即隱藏。" }
          - { label: "🖼️ 優惠宣傳海報 (Poster Image)", name: "poster", widget: "image", hint: "上傳你要向客人展示的宣傳海報圖片。" }
          - { label: "📅 優惠截止日期 (Expiry Date)", name: "expiry_date", widget: "datetime", format: "YYYY-MM-DD", hint: "設定優惠活動的最後有效日期。" }
          - { label: "✉️ 預設查詢電郵主旨 (Email Subject)", name: "subject", widget: "string", default: "Inquiry about Promotion", hint: "當客人點擊優惠海報的查詢時，自動帶入電郵的主旨文字。" }