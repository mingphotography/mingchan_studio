backend:
  name: git-gateway
  branch: main

# 開啟草稿箱 (Workflow) 功能
publish_mode: editorial_workflow

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # ==========================================
  # 1. 首頁 Hero 大圖設定
  # ==========================================
  - name: "hero_settings"
    label: "🌟 首頁大圖 (Hero Banner) 設定"
    files:
      - file: "content/hero.json"
        label: "首頁 6 張輪播大圖管理"
        name: "hero_slides"
        fields:
          - label: "👉 點擊下方按鈕以新增或修改首頁大圖 (建議設定 6 張)"
            name: "slides"
            widget: "list"
            hint: "💡 提示：按「Add」新增相片；可以隨時用滑鼠上下拖曳來調整輪播順序。"
            fields:
              - { label: "🖼️ 選擇相片檔", name: "image", widget: "image", required: true, hint: "建議上傳高清橫向大圖" }
              - { label: "📍 相片主題 / 地點文字 (可選)", name: "title", widget: "string", required: false, hint: "例如：SEVEN SISTERS, UK" }
              - { 
                  label: "🎯 手機版主體焦點位置 (防裁切)", 
                  name: "focus", 
                  widget: "select", 
                  options: [
                    { label: "置中 (預設 - 主體在中間)", value: "center center" },
                    { label: "靠左 (主角在左邊時選這個)", value: "left center" },
                    { label: "靠右 (主角在右邊時選這個)", value: "right center" }
                  ],
                  default: "center center",
                  hint: "⚠️ 手機直向瀏覽時橫相左右會被裁切。如果主角偏左或偏右，請在這裡更改對齊方向！"
                }

  # ==========================================
  # 2. 作品集 (Selected Works) 管理
  # ==========================================
  - name: "portfolio"
    label: "作品集 (Selected Works)"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "相簿名稱 (Folder Name)", name: "title", widget: "string", hint: "例如：Smith & Angel" }
      - { 
          label: "分類 (Category)", 
          name: "category", 
          widget: "select", 
          options: ["Wedding", "Pre-Wedding", "Portraits", "Commercial"],
          default: "Wedding"
        }
      - { label: "拍攝地點 (Location)", name: "location", widget: "string", required: false, hint: "例如：LONDON, UK" }
      - { label: "封面圖片 (Cover Image)", name: "cover", widget: "image", required: true }
      - { 
          label: "相簿內容圖片 (Gallery Photos)", 
          name: "photos", 
          widget: "list", 
          field: { label: "相片", name: "photo", widget: "image" },
          hint: "可以一次過上傳多張相片到這個相簿"
        }

  # ==========================================
  # 3. 日誌文章 (Journal) 管理
  # ==========================================
  - name: "journal"
    label: "日誌文章 (Journal)"
    folder: "content/journal"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "title", label: "文章標題 (Title)", widget: "string", hint: "例如：Chloe & Perry | A Quiet Proposal at Seven Sisters" }
      - { name: "date", label: "發布日期 (Publish Date)", widget: "datetime", format: "YYYY-MM-DD HH:mm" }
      - { name: "cover", label: "封面圖片 (Cover Image)", widget: "image", required: true }
      - { name: "snippet", label: "文章摘要 (Short Intro)", widget: "text", required: false }
      - { name: "location", label: "拍攝地點 (Location)", widget: "string", required: false }
      - { 
          name: "type", 
          label: "拍攝項目類型", 
          widget: "select", 
          options: ["Pre-Wedding", "Proposal", "Wedding Day", "Portrait", "Editorial"],
          default: "Pre-Wedding" 
        }
      - { 
          name: "body", 
          label: "文章內文與相片 (Body Text & Images)", 
          widget: "markdown"
        }