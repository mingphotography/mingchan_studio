backend:
  name: git-gateway
  branch: main

# 💡 開啟草稿箱 (Workflow) 功能：寫完文章按 Save 會進入 Draft，不會立刻公開上網
publish_mode: editorial_workflow

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # ==========================================
  # 1. 輪播 Hero 圖片管理 (新增：可由 Ming 自行更改首頁 6 張大圖)
  # ==========================================
  - name: "hero_settings"
    label: "首頁 Hero 大圖設定"
    files:
      - file: "content/hero.json"
        label: "首頁 6 張輪播相片"
        name: "hero_slides"
        fields:
          - label: "Hero 相片列表 (建議設定 6 張)"
            name: "slides"
            widget: "list"
            fields:
              - { label: "相片檔", name: "image", widget: "image", required: true }
              - { label: "相片主題/地點 (如：SEVEN SISTERS, UK)", name: "title", widget: "string", required: false }
              - { 
                  label: "主體焦點位置 (防止手機直向裁切主體)", 
                  name: "focus", 
                  widget: "select", 
                  options: [
                    { label: "置中 (預設 - 主體喺中間)", value: "center center" },
                    { label: "靠左 (主體喺左邊)", value: "left center" },
                    { label: "靠右 (主體喺右邊)", value: "right center" }
                  ],
                  default: "center center",
                  hint: "如果相片主角偏左/偏右，簡呢度可以防止手機睇嗰陣裁切掉主角"
                }

  # ==========================================
  # 2. Journal 日誌文章管理
  # ==========================================
  - name: "journal"
    label: "日誌文章 (Journal)"
    folder: "content/journal"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "title", label: "文章標題 (Title)", widget: "string", hint: "例如：Chloe & Perry | A Quiet Proposal at Seven Sisters" }
      - { name: "date", label: "發布日期 (Publish Date)", widget: "datetime", format: "YYYY-MM-DD HH:mm", hint: "設定未來日期代表預定時間公開" }
      - { name: "cover", label: "封面圖片 (Cover Image)", widget: "image", required: true, hint: "建議上傳 16:9 橫相" }
      - { name: "snippet", label: "文章摘要 (Short Intro)", widget: "text", required: false, hint: "1-2 句話概括重點，顯示在文章列表卡片" }
      - { name: "location", label: "拍攝地點 (Location)", widget: "string", required: false, hint: "例如：UK / Hong Kong / Paris" }
      - { 
          name: "type", 
          label: "拍攝項目類型", 
          widget: "select", 
          options: ["Pre-Wedding", "Proposal", "Wedding Day", "Portrait", "Editorial"],
          default: "Pre-Wedding" 
        }
      - { name: "hkppa", label: "HKPPA 會員作品", widget: "boolean", default: false, required: false }
      - { name: "rosewood", label: "Rosewood 認可作品", widget: "boolean", default: false, required: false }
      - { 
          name: "body", 
          label: "文章內文與相片 (Body Text & Images)", 
          widget: "markdown",
          hint: "點擊工具列的「+」或圖片圖示，即可在段落之間插入相片"
        }